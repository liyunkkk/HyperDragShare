name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK platform 37
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools" > /dev/null
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -sfn "$ANDROID_SDK_ROOT/platforms/android-37.0" "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Run unit tests and lint
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Assemble unsigned release APK
        run: |
          set +e
          ./gradlew assembleRelease --max-workers=2 --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8" \
            > "$RUNNER_TEMP/gradle-assemble.log" 2>&1
          status=$?
          grep -n -E "What went wrong|Caused by:|FAILED|OutOfMemory|Compilation failed|Unsupported|Execution failed" "$RUNNER_TEMP/gradle-assemble.log" | head -50 | sed 's/^/::error::/'
          tail -80 "$RUNNER_TEMP/gradle-assemble.log" | sed 's/^/::debug::/'
          exit $status

      - name: Locate unsigned release APK
        id: release_apk
        run: |
          mapfile -t apk_paths < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk')
          if [ "${#apk_paths[@]}" -eq 0 ]; then
            mapfile -t apk_paths < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk')
          fi
          test "${#apk_paths[@]}" -eq 1
          echo "path=${apk_paths[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "${{ steps.release_apk.outputs.path }}#HyperDragShare-${GITHUB_REF_NAME}-unsigned.apk"
          --title "HyperDragShare ${GITHUB_REF_NAME} (unsigned)"
          --notes "未签名版本，仅供个人安装使用。"
          --generate-notes
